# Rendered with envsubst at container start: only ${API_ORIGIN} is replaced; nginx's own
# variables ($uri and friends) are left alone.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (PRD S13). Defined once at server level and deliberately NOT repeated in
    # any location: nginx drops inherited add_header lines in a location that sets its own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' ${API_ORIGIN}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html, which must never be cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
