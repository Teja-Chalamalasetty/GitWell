name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Coverage gate for rules, scanner and github (95% each)
        run: |
          uv run coverage report --include="app/rules/*" --fail-under=95
          uv run coverage report --include="app/scanner/*" --fail-under=95
          uv run coverage report --include="app/github/*" --fail-under=95

  backend-postgres:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitwell
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gitwell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitwell -d gitwell"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gitwell:ci-only-password@localhost:5432/gitwell
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrations round trip (upgrade, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Full test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gitwell:ci-only-password@localhost:5432/gitwell
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build --tag gitwell-backend ./backend
      - name: Build the frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000/api/v1 \
            --tag gitwell-frontend ./frontend
