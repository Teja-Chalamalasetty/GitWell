[project]
name = "gitwell"
version = "1.0.0"
description = "Scan GitHub repositories against an engineering-quality checklist."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "pytest-socket>=0.7",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pathspec>=1.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--allow-hosts=127.0.0.1,::1"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The PRD's secret-detection regexes must be copied verbatim, so long lines are intentional.
"app/rules/secrets.py" = ["E501"]
# Importing fixtures into a test module is the normal pytest pattern.
"tests/**" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.scanner.*", "app.rules.*", "app.github.*"]
strict = true
